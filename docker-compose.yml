services:
  web:
    build: .
    ports:
      - "3661:3000"
    environment:
      - DATABASE_URL=file:/app/data/payload.db
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env}
    volumes:
      - db-data:/app/data
      - media-data:/app/media
    restart: unless-stopped

volumes:
  db-data:
  media-data:
